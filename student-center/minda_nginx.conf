server {
    listen 80;
    server_name minda.io.vn www.minda.io.vn;

    # Max upload size (Cho phép upload bài tập nặng)
    client_max_body_size 4G;

    # 1. FRONTEND (Next.js)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. BACKEND API (FastAPI)
    location /api {
        proxy_pass http://localhost:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. STIRLING-PDF API (Docker)
    location /stirling-api/ {
        proxy_pass http://localhost:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4G;
    }

    # 4. STATIC FILES (Ảnh/Video)
    location /static {
        alias /var/www/minda/student-center/backend/static;
    }

    # 5. PEERJS SERVER (WebRTC)
    location /peerjs/ {
        proxy_pass http://localhost:9000/peerjs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
