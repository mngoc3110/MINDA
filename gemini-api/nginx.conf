upstream gemini_pool {
    # Nginx sẽ tự động chia đều request lần lượt cho 2 port
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

server {
    listen 80;
    server_name api.ten-mien-cua-ban.com; # Thay bằng domain của bạn

    location / {
        proxy_pass http://gemini_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Cấu hình bắt buộc để hỗ trợ nhận kết quả chữ chạy ra từ từ (Streaming / SSE)
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }
}
